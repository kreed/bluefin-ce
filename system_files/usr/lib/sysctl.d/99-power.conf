# The two sysctls that tuned's "powersave" profile sets and "balanced-battery"
# — the profile tuned-ppd picks on battery — leaves at the kernel default.
# Setting them out-of-band rather than switching profiles keeps the GNOME power
# slider meaning what it means today. tuned's sysctl plugin saves whatever value
# it finds when a profile is applied and restores that on the way out, so these
# survive a trip through power-saver and back rather than reverting to the
# kernel default.
#
# /usr/lib rather than /etc: this is image policy, not local admin config, so it
# stays out of the 3-way /etc merge and an admin can still override it by name.

# Batch page writeback into 15s wakeups instead of 5s, so the disk and the CPU
# get longer uninterrupted idle stretches. The cost is a wider window of
# unflushed data if a machine loses power outright.
vm.dirty_writeback_centisecs = 1500

# The hard-lockup detector ticks a perf counter on every CPU forever. Turning it
# off gives up a diagnosis path for kernel hangs, which is a trade a laptop can
# make.
kernel.nmi_watchdog = 0
